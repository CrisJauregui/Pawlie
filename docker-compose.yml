services:
  db:
    image: postgres:16
    env_file: .env
    ports:
      - "5432:5432"

  api:
    build: ./backend
    env_file: .env
    environment:
      DB_HOST: db
    ports:
      - "3000:3000"
    depends_on:
      - db
      
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: